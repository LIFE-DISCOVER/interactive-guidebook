name: |-
  BG 19: Construction - Installing PV System, direct connection lines, battery storage devices
step: sourcing-equipment
summary: |-
  Specify requirements for the PV installation/battery storage solutions detailing the technical and functional needs of the desired equipment, including any performance criteria or standards.
description: |-
  Collect information from the market suppliers of PV equipment, battery storage equipment, cabling and smart metering devices. Get price offers and make a comparative analysis.
web_link: https://www.solartim.eu
input: |-
  Approved technical drawings and specifications, business plan and financial plan.
result: |-
  A list of suppliers, price lists for equipment based on specific technical specifications; comparative analysis.
