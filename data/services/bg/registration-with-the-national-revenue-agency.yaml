name: 'BG 24: Registration with the National Revenue Agency'
step: registration-tax
summary: |-
  Registration of the legal entity of the REC with the National Revenue Agency of Bulgaria for tax purposes. Once registered, you will receive a tax verification number.
description: |-
  Register the legal entity of the REC with the National Revenue Agency and receive a VAT number.
input: Data about REC participants and general information about the legal entity
result: Receive VAT number by National Revenue Agency
remaining_hurdles: |-
  Lack of clarity regarding the taxation of certain aspects of the income generated by RECs in Bulgaria
bg:
  name: 'BG 24: Регистрация в Националната агенция за приходите'
  summary: |-
    Регистрация на юридическото лице на ВЕО в Националната агенция за приходите (НАП) за данъчни цели. След регистрацията ще получите данъчен идентификационен номер.
  description: |-
    Регистрирайте юридическото лице на ВЕО в НАП и получете идентификационен номер по ДДС.
  input: Данни за участниците във ВЕО и обща информация за юридическото лице
  result: Получаване на идентификационен номер по ДДС от НАП
  remaining_hurdles: |-
    Неяснота относно данъчното облагане на някои видове доходи, генерирани от ВЕО в България
