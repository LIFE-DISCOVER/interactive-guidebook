name: 'BG 29: Membership engagement'
step: membership-engagement
summary: |-
  In order to ensure transparency and accountable management of the CEP/EC their members should be regularly updated with current development, problems and achievements.
description: |-
  Design a communication strategy, media campaigns and grass-roots events. Review and update your policies on attracting new members.
stakeholder: Chamber of Energy communities in Bulgaria
input: |-
  Management structure and rules of procedures; Communication strategy; Recruitment policies
result: Management and communication strategies designed/updated and implemented.
bg:
  name: 'BG 29: Ангажиране на членовете'
  summary: |-
    За да се гарантира прозрачно и отговорно управление на ОЕП/ЕО, членовете трябва редовно да бъдат информирани за текущото развитие, проблемите и постиженията.
  description: |-
    Изгответе комуникационна стратегия, медийни кампании и местни събития. Преглеждайте и актуализирайте политиките си за привличане на нови членове.
  stakeholder: Камара на енергийните общности в България
  input: |-
    Структура на управление и правилници; комуникационна стратегия; политики за привличане на членове
  result: Изготвени/актуализирани и прилагани стратегии за управление и комуникация.
  reviewed: false
