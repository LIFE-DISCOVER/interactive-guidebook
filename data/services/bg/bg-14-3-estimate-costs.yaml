  summary: |-
    Оценете разходите за изграждане на фотоволтаичната инсталация, батерийните съоръжения за съхранение и директните електропроводи между инсталациите на участниците в ОЕП/ЕО.
  description: |-
    Съставете списъци за покупки/разходи за оборудването, необходимо за изграждане на енергийните инсталации на ЕО.
  input: |-
    Данни за размера и конфигурацията, технически описания и характеристики с технически чертежи.
  result: Разходи за труд и материали под формата на количествено-стойностна сметка
