name: 'BG 14-3: Estimate - Costs'
step: analysis-economics
summary: |-
  Estimate the costs related to the building of the PV installation, electricity battery storages, direct power lines between installations of participants in the CEPs/ECs.
description: |-
  Build purchase/cost lists for the equipment, needed to construct the E.C. energy installations.
input: |-
  Data about size and configuration, technical descriptions and characteristics with technical drawings.
result: Labor and material costs in the form of bill of quantities and values
bg:
