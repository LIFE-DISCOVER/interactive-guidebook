name: 'BG 14-1: Analysis - Self energy consumption by CEP/EC participants'
step: analysis-economics
summary: |-
  Use real and prognosis data for the last 3 years to match the electricity yield with the consumption profile of each of the CEP/EC participants.
description: |-
  Find the necessary economic data about the own consumption and the yield of the PV installations in order to be able to make the basic profit and loss calculations for the project.
input: Electricity yield, consumption profile of each of the CEP/EC participants.
result: |-
  Daily profile on annual basis for the level of self energy consumption within the CEP/EC.
