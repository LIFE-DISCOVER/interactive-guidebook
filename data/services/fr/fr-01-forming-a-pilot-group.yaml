name: FR-01-Forming a pilot group
step: community-building
summary: |-
  Launching a photovoltaic community energy project is complex and requires good information at the very start. It is better to form a small team of motivated people. The website photovoltaique.info is the reference source of information.
description: |-
  The OSS helps you navigate the existing resources to get enough information on photovoltaics and energy communities, public aids, etc.
web_link: https://www.photovoltaique.info/fr/
input: A demand for information or advice on PV of energy community by any person.
result: |-
  Information on PV and energy community; Advice on how to state your vision and objectives.
remaining_hurdles: Information about the specifics of condominiums and urban centre settings.
