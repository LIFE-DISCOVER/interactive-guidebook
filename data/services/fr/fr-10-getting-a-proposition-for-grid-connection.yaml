name: FR-10-Getting a Proposition for grid connection
step: analysis-power-grid
summary: |-
  Once you have completed your demand for grid connection (DCR), you will receive within a defined timeframe a Proposition with a price to pay for connecting to the grid (PTF or PDR) that you will have to accept to launch construction work.
