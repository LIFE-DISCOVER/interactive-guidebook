name: FR-17-Membership engagement
step: membership-engagement
summary: |-
  Recruiting new consumers and producers is a way for the community to optimize self-consumption rates and inject to the grid the least of surplus possible.
description: |-
  The OSS helps you to define the right size of your community throughout its lifecycle, and to look for new members. The OSS centralizes information and the network of stakeholders.
