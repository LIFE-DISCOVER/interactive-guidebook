name: FR-15-Maintenance of your PV plant
step: maintenance-hw
summary: |-
  Maintenance is necessary to ensure correct functioning. Maintenance can be made by yourself as a producer, by professionals. It is advised to have an annual visual check of your plant.
description: |-
  The OSS advises you to anticipate maintenance cost and choose between the best maintenance approach.
input: Your plant characteristics, your community roles and your budget.
result: Correctly functioning plant
