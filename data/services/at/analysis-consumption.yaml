name: 'AT: Analysis - Consumption'
step: analysis-consumption
summary: |-
  Determine the annual consumption. Your annual electricity demand is stated on your utility bill. You also find it on the web portal of your electricity provider and/or grid operator.
description: Guidance
input: Utility bill or Access to web portal
result: Total annual consumption in kWh
remaining_hurdles: Load dynamics are not reflected in the total consumption
