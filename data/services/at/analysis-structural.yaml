name: 'AT: Analysis - Structural'
step: analysis-structural
summary: |-
  If a structural analysis is required, then it must include the following: For a new building: Proof of the load-bearing capacity, usability, and durability of the load-bearing structure in accordance with OIB-RL 1. For the subsequent installation of a PV system: Survey of the existing structure, at least to Level 1, in accordance with the guidelines of OIB-RL 1; Proof of the minimal impact of the measure (load increase <= 3%) OR Proof of the load-bearing capacity, usability, and durability of…
description: |-
  If a structural analysis is required, then it must include the following: For a new building: Proof of the load-bearing capacity, usability, and durability of the load-bearing structure in accordance with OIB-RL 1. For the subsequent installation of a PV system: Survey of the existing structure, at least to Level 1, in accordance with the guidelines of OIB-RL 1; Proof of the minimal impact of the measure (load increase <= 3%) OR Proof of the load-bearing capacity, usability, and durability of the load-bearing structure in accordance with OIB-RL 1

  Provide a referral for a civil engineer
input: Construction Plans that show the roof structure
result: Structural analysis approved
