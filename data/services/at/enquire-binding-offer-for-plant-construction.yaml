name: 'AT: Enquire binding offer for plant construction'
step: sourcing-equipment
summary: |-
  Provide pre-planning documents, scope of equipment, information about location, address, restrictions, information about building, roof, electrical installations and related locations including pictures, provide grid access confirmation document.
description: Provide pre-planning documents and scope of equipment to potential suppliers.
