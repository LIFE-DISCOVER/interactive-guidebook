name: HR-21-Sourcing - Equipment
step: sourcing-equipment
summary: |-
  To ensure a successful procurement process, start by clearly specifying your requirements.
description: |-
  Certified PV plant installers often offer a package of services that includes a range of services from obtaining all permits and necessary documentation, to purchasing and installing equipment (Turnkey system).
stakeholder: Solvis d.o.o.
input: List of requirements specification; Contracting process
result: Comprehensive decision and contract with PV equipment supplier.
