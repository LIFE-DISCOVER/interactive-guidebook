  summary: |-
    Per mantenere i servizi ai membri della comunità e il loro coinvolgimento continuo, tenerli aggiornati sulle ultime informazioni e novità. Reclutare attivamente nuovi membri per ampliare la comunità e accrescerne l'impatto.
  description: |-
    Il servizio consiste nell'organizzare attività informative e di sensibilizzazione rivolte a cittadini, enti pubblici, imprese, scuole, associazioni e altri soggetti del territorio.
  input: Elenco dei membri attuali e potenziali della CER
  result: |-
    Aggiornamento dei membri; reclutamento di nuovi membri; organizzazione di eventi informativi e sociali; offerta di assistenza
