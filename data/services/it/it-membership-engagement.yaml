name: IT-Membership engagement
step: membership-engagement
summary: |-
  To maintain CEP member services and continuous engagement, keep members updated with the latest information and developments. Actively recruit new members to expand the community and enhance its impact.
description: |-
  The service consists of organizing informational and awareness-raising activities aimed at citizens, public authorities, businesses, schools, associations, and other local stakeholders.
input: List of current and potential REC members
result: |-
  Keeping members updated; Recruiting new members; Organizing informational and social events; Offering assistance
it:
