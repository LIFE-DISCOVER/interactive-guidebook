  description: |-
    Assistere la CER nel comunicare al GSE le variazioni dei membri. Registrare i nuovi partecipanti alla CER e aggiornare l'elenco.
  stakeholder: GSE
  input: |-
    Accedere all'Area Clienti sul sito del GSE tramite SPID. Aggiungere i nuovi membri e il loro ruolo.
  result: Dati dei membri della CER aggiornati.
