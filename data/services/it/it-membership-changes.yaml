name: IT-Membership changes
step: membership-administration
summary: |-
  In order to manage the REC effectively, report any membership changes to the GSE to ensure accurate records. Register new participants in the REC and update the member list.
description: |-
  Assist the REC to report membership changes to GSE. Register new participants of REC and update the list.
stakeholder: GSE
input: |-
  Enter on customer area at GSE website through SPID. Add new members and their role.
result: Updated records of the REC members.
