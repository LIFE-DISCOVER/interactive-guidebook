    IT-Autorizzazione per impianti fotovoltaici su edifici esistenti e a terra sulla piattaforma SUER
  summary: |-
    Il servizio aiuta l'utente ad accedere alla piattaforma SUER (sportello per le energie rinnovabili) e fornisce il modello unico per l'autorizzazione di impianti fotovoltaici integrati su edifici esistenti.
  description: |-
    Guida all'accesso alla piattaforma SUER e alla compilazione dei modelli di autorizzazione. Il nuovo Testo unico sulle fonti di energia rinnovabile (FER), pubblicato il 12 dicembre 2024, semplifica le procedure amministrative per la produzione di energia da fonti rinnovabili.
  stakeholder: GSE
  input: |-
