name: |-
  IT-Authorisation for PV plants in existing buildings and on the ground on the SUER platform
step: permit-building-regulations
summary: |-
  The service supports the user to join the SUER Platform (helpdesk for renewable energies) and provides the single model for permit for integrated PV plants systems in existing buildings.
description: |-
  Guidance to access to SUER Platform and how to fill templates for authorisation. The new Consolidated Act on Renewable Energy Sources (FER), published on 12 December 2024, simplifies administrative procedures for the production of energy from renewable sources.
web_link: https://suer.gse.it/suer/home
stakeholder: GSE
input: |-
  Go to https://suer.gse.it/suer/home, enter your access credentials, download the module, collect all the required information and fill in
result: Submission of all applications for new renewable installations.
remaining_hurdles: The platform is still under construction.
