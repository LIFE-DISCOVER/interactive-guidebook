title: Value Proposition
sort_order: 106
topic: Social
description: Define the purpose and the vision for forming a community.
objective: |-
  - What is the (first) vision of your project?
  - What are the potential outcomes?
  - How would the members benefit from it?
  - How would the community benefit from it?
description_long: |-
  The initial vision of your project should clearly outline its overarching goals and aspirations. Consider the potential outcomes of the project to define its success criteria and impact. Reflect on how the members will benefit from the project whether through receiving cheaper electricity, a revenue for their investment, income from renting out roof top space, or other valuable gains. Additionally, assess how the community at large will benefit from the project, such as through strengthened networks, improved resources, or broader social impact. Draft an initial presentation of your community to facilitate outreach to potential partners and authorities.
de:
  title: Nutzenversprechen
  description: Legen Sie Zweck und Vision für die Gründung einer Gemeinschaft fest.
  objective: |-
    - Was ist die (erste) Vision Ihres Projekts?
    - Welche Ergebnisse sind möglich?
    - Welchen Nutzen haben die Mitglieder?
    - Welchen Nutzen hat die Gemeinschaft?
  description_long: |-
    Die erste Vision Ihres Projekts sollte seine übergeordneten Ziele und Ansprüche klar beschreiben. Überlegen Sie, welche Ergebnisse möglich sind, um Erfolgskriterien und Wirkung festzulegen. Denken Sie darüber nach, welchen Nutzen die Mitglieder haben: günstigeren Strom, eine Rendite auf ihre Investition, Einnahmen aus der Vermietung von Dachflächen oder anderes. Bewerten Sie außerdem, welchen Nutzen die Allgemeinheit hat, etwa stärkere Netzwerke, bessere Ressourcen oder eine breitere gesellschaftliche Wirkung. Erstellen Sie eine erste Präsentation Ihrer Gemeinschaft, um mögliche Partner und Behörden anzusprechen.
  reviewed: false
fr:
  title: Proposition de valeur
  description: Définissez la raison d'être et la vision de la communauté à créer.
  objective: |-
    - Quelle est la (première) vision de votre projet ?
    - Quels sont les résultats possibles ?
    - Quels bénéfices pour les membres ?
    - Quels bénéfices pour la collectivité ?
  description_long: |-
    La vision initiale de votre projet doit exposer clairement ses objectifs et ses ambitions. Envisagez les résultats possibles pour définir les critères de réussite et l'impact. Réfléchissez aux bénéfices pour les membres : électricité moins chère, rémunération de leur investissement, revenus de la location de toiture ou autres avantages. Évaluez aussi les bénéfices pour la collectivité, comme des réseaux renforcés, de meilleures ressources ou un impact social plus large. Préparez une première présentation de votre communauté pour faciliter les contacts avec des partenaires et les autorités.
  reviewed: false
it:
  title: Proposta di valore
  description: Definire lo scopo e la visione per costituire una comunità.
  objective: |-
    - Qual è la (prima) visione del vostro progetto?
    - Quali sono i possibili risultati?
    - Quali benefici avrebbero i membri?
    - Quali benefici avrebbe la collettività?
  description_long: |-
    La visione iniziale del progetto dovrebbe delineare chiaramente i suoi obiettivi e le sue aspirazioni generali. Considerate i possibili risultati per definire criteri di successo e impatto. Riflettete sui benefici per i membri: energia più economica, un rendimento sull'investimento, entrate dall'affitto delle superfici dei tetti o altri vantaggi. Valutate anche i benefici per la collettività, come reti più solide, risorse migliori o un impatto sociale più ampio. Preparate una prima presentazione della vostra comunità per facilitare il contatto con potenziali partner e con le autorità.
  reviewed: false
hr:
  title: Vrijednosna ponuda
  description: Definirajte svrhu i viziju osnivanja zajednice.
  objective: |-
    - Koja je (prva) vizija vašeg projekta?
    - Koji su mogući ishodi?
    - Kakvu bi korist imali članovi?
    - Kakvu bi korist imala zajednica?
  description_long: |-
    Početna vizija projekta treba jasno opisati njegove glavne ciljeve i težnje. Razmotrite moguće ishode projekta kako biste definirali kriterije uspjeha i učinak. Razmislite kakvu će korist imati članovi: jeftiniju električnu energiju, prinos na ulaganje, prihod od najma krovnih površina ili drugu vrijednost. Procijenite i kakvu će korist imati šira zajednica, primjerice jače mreže, bolje resurse ili širi društveni učinak. Izradite prvu prezentaciju svoje zajednice kako biste lakše pristupili mogućim partnerima i vlastima.
  reviewed: false
bg:
  title: Предложение за стойност
  description: Определете целта и визията за създаване на общност.
  objective: |-
    - Каква е (първоначалната) визия на проекта ви?
    - Какви са възможните резултати?
    - Каква полза ще имат членовете?
    - Каква полза ще има общността?
  description_long: |-
    Първоначалната визия на проекта трябва ясно да описва неговите основни цели и стремежи. Обмислете възможните резултати, за да определите критериите за успех и въздействието. Помислете каква полза ще имат членовете: по-евтина електроенергия, доходност от инвестицията, приход от отдаване на покривни площи под наем или друга стойност. Оценете и каква полза ще има обществото като цяло, например по-силни връзки, по-добри ресурси или по-широко социално въздействие. Изгответе първоначално представяне на общността, за да улесните контактите с потенциални партньори и институции.
  reviewed: false
