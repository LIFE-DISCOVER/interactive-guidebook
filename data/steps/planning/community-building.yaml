title: Community Building
sort_order: 104
topic: Social
description: Establish the foundation of your community
objective: |-
  - Build a team of motivated people
  - Identify key members
  - Foster strong relationships and establish effective team dynamics
  - Secure support
description_long: |-
  Assemble a team of motivated and skilled individuals. Organize a steering committee to make major decisions during the planning phase and keep other members informed. Ensure you have a project spokesperson and a coordinator. These key members will drive group dynamics, build mutual trust, and ensure that everyone has a voice. Engage local individuals interested in photovoltaics and community projects. Additionally, seek support from external sources or, at the very least, secure a favorable attitude towards your project. Reach out to elected representatives and officials to introduce your community project to local authorities.
de:
  title: Aufbau der Gemeinschaft
  description: Legen Sie das Fundament Ihrer Gemeinschaft
  objective: |-
    - Ein Team motivierter Menschen bilden
    - Schlüsselpersonen bestimmen
    - Gute Beziehungen fördern und eine wirksame Teamdynamik schaffen
    - Unterstützung sichern
  description_long: |-
    Stellen Sie ein Team motivierter und kompetenter Menschen zusammen. Bilden Sie eine Steuerungsgruppe, die in der Planungsphase die wichtigen Entscheidungen trifft und die übrigen Mitglieder informiert. Sorgen Sie für eine Sprecherin oder einen Sprecher des Projekts und eine Koordination. Diese Schlüsselpersonen prägen die Gruppendynamik, schaffen Vertrauen und sorgen dafür, dass alle gehört werden. Gewinnen Sie Menschen vor Ort, die sich für Photovoltaik und Gemeinschaftsprojekte interessieren. Suchen Sie außerdem Unterstützung von außen oder sichern Sie sich zumindest eine wohlwollende Haltung gegenüber Ihrem Projekt. Wenden Sie sich an gewählte Vertreterinnen und Vertreter sowie an die Verwaltung, um Ihr Gemeinschaftsprojekt den örtlichen Behörden vorzustellen.
  reviewed: false
fr:
  title: Construction de la communauté
  description: Posez les fondations de votre communauté
  objective: |-
    - Réunir une équipe de personnes motivées
    - Identifier les membres clés
    - Favoriser des relations solides et une dynamique d'équipe efficace
    - Obtenir des soutiens
  description_long: |-
    Réunissez une équipe de personnes motivées et compétentes. Créez un comité de pilotage qui prendra les grandes décisions pendant la phase de conception et tiendra les autres membres informés. Désignez un porte-parole et un coordinateur du projet. Ces membres clés animeront la dynamique du groupe, créeront la confiance et veilleront à ce que chacun puisse s'exprimer. Mobilisez les habitants intéressés par le photovoltaïque et les projets collectifs. Cherchez aussi des soutiens extérieurs ou, au minimum, une attitude favorable envers votre projet. Contactez les élus et les services pour présenter votre projet collectif aux autorités locales.
  reviewed: false
it:
  title: Costruzione della comunità
  description: Gettare le basi della vostra comunità
  objective: |-
    - Formare un gruppo di persone motivate
    - Individuare i membri chiave
    - Favorire relazioni solide e dinamiche di gruppo efficaci
    - Ottenere sostegno
  description_long: |-
    Riunite un gruppo di persone motivate e competenti. Costituite un comitato promotore che prenda le decisioni principali nella fase di pianificazione e tenga informati gli altri membri. Individuate un portavoce e un coordinatore del progetto. Questi membri chiave guideranno le dinamiche del gruppo, costruiranno fiducia reciproca e faranno in modo che tutti possano esprimersi. Coinvolgete le persone del territorio interessate al fotovoltaico e ai progetti comunitari. Cercate inoltre sostegno esterno o, almeno, un atteggiamento favorevole verso il vostro progetto. Contattate amministratori e funzionari per presentare il progetto alle autorità locali.
  reviewed: false
hr:
  title: Izgradnja zajednice
  description: Postavite temelje svoje zajednice
  objective: |-
    - Okupiti tim motiviranih ljudi
    - Utvrditi ključne članove
    - Njegovati čvrste odnose i učinkovitu timsku dinamiku
    - Osigurati podršku
  description_long: |-
    Okupite tim motiviranih i stručnih ljudi. Osnujte upravljački odbor koji će donositi glavne odluke u fazi planiranja i obavještavati ostale članove. Pobrinite se da projekt ima glasnogovornika i koordinatora. Ti ključni članovi vodit će dinamiku grupe, graditi međusobno povjerenje i paziti da se svi mogu izraziti. Uključite lokalne ljude zainteresirane za fotonaponske sustave i projekte zajednice. Potražite i vanjsku podršku ili barem osigurajte naklonost prema svom projektu. Obratite se izabranim predstavnicima i službenicima kako biste projekt zajednice predstavili lokalnim vlastima.
  reviewed: false
bg:
  title: Изграждане на общността
  description: Поставете основите на своята общност
  objective: |-
    - Създаване на екип от мотивирани хора
    - Определяне на ключовите членове
    - Изграждане на здрави отношения и ефективна екипна динамика
    - Осигуряване на подкрепа
  description_long: |-
    Съберете екип от мотивирани и компетентни хора. Сформирайте управителен комитет, който да взема основните решения във фазата на планиране и да информира останалите членове. Осигурете говорител и координатор на проекта. Тези ключови членове ще движат груповата динамика, ще изграждат взаимно доверие и ще се грижат всеки да бъде чут. Привлечете местни хора, които се интересуват от фотоволтаици и общностни проекти. Потърсете и външна подкрепа или поне осигурете благосклонно отношение към проекта. Свържете се с изборни представители и служители, за да представите общностния си проект на местните власти.
  reviewed: false
