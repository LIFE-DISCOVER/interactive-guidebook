title: Community Assessment
sort_order: 105
topic: Social
description: Get to know your community.
objective: |-
  - How do you define your community?
  - How big is your comm and who are your members?
  - What are their needs and motivation?
  - What are they willing to share within the community?
  - Who are the potential candidates for future membership?
description_long: |-
  Understanding the dynamics of your community involves assessing several key aspects. First, evaluate the purpose of your community, and its size to gauge its overall reach and potential impact.  Next, identify the members of your community to understand its composition. Consider potential future members if you aim to expand. Explore the needs and motivations of your members, and potential members, to better align community initiatives with their interests and objectives.
  Finally, consider what members are willing to share within the community, as this will shape the level of collaboration and resource exchange. By addressing these elements, you can develop a more effective strategy for engaging and supporting your community.
de:
  title: Analyse der Gemeinschaft
  description: Lernen Sie Ihre Gemeinschaft kennen.
  objective: |-
    - Wie definieren Sie Ihre Gemeinschaft?
    - Wie groß ist Ihre Gemeinschaft und wer sind die Mitglieder?
    - Was sind ihre Bedürfnisse und Beweggründe?
    - Was sind sie bereit, innerhalb der Gemeinschaft zu teilen?
    - Wer kommt als künftiges Mitglied in Frage?
  description_long: |-
    Um die Dynamik Ihrer Gemeinschaft zu verstehen, sind mehrere zentrale Aspekte zu bewerten. Bewerten Sie zunächst den Zweck Ihrer Gemeinschaft und ihre Größe, um Reichweite und mögliche Wirkung einzuschätzen. Stellen Sie dann fest, wer die Mitglieder sind, um die Zusammensetzung zu verstehen. Denken Sie an mögliche künftige Mitglieder, wenn Sie wachsen möchten. Erkunden Sie die Bedürfnisse und Beweggründe Ihrer jetzigen und möglichen Mitglieder, um die Vorhaben der Gemeinschaft auf deren Interessen und Ziele abzustimmen.
    Überlegen Sie schließlich, was die Mitglieder innerhalb der Gemeinschaft zu teilen bereit sind, denn das bestimmt, wie eng zusammengearbeitet und wie viel geteilt wird. Wenn Sie diese Punkte klären, können Sie eine wirksamere Strategie entwickeln, um Ihre Gemeinschaft einzubinden und zu unterstützen.
  reviewed: false
fr:
  title: Diagnostic de la communauté
  description: Apprenez à connaître votre communauté.
  objective: |-
    - Comment définissez-vous votre communauté ?
    - Quelle est sa taille et qui sont ses membres ?
    - Quels sont leurs besoins et leurs motivations ?
    - Que sont-ils prêts à partager au sein de la communauté ?
    - Qui sont les futurs membres potentiels ?
  description_long: |-
    Comprendre la dynamique de votre communauté suppose d'en évaluer plusieurs aspects clés. Évaluez d'abord sa raison d'être et sa taille pour mesurer sa portée et son impact potentiel. Identifiez ensuite ses membres pour comprendre sa composition. Pensez aux futurs membres potentiels si vous souhaitez vous agrandir. Explorez les besoins et les motivations des membres actuels et potentiels pour aligner les initiatives de la communauté sur leurs intérêts et leurs objectifs.
    Enfin, déterminez ce que les membres sont prêts à partager au sein de la communauté, car cela conditionne le niveau de coopération et d'échange de ressources. En traitant ces points, vous pourrez élaborer une stratégie plus efficace pour mobiliser et soutenir votre communauté.
  reviewed: false
it:
  title: Valutazione della comunità
  description: Conoscere la propria comunità.
  objective: |-
    - Come definite la vostra comunità?
    - Quanto è grande la comunità e chi sono i membri?
    - Quali sono i loro bisogni e le loro motivazioni?
    - Che cosa sono disposti a condividere nella comunità?
    - Chi sono i potenziali futuri membri?
  description_long: |-
    Capire le dinamiche della vostra comunità significa valutarne diversi aspetti chiave. Valutate innanzitutto lo scopo della comunità e la sua dimensione, per stimarne la portata e il potenziale impatto. Individuate poi i membri, per comprenderne la composizione. Considerate i potenziali futuri membri se intendete crescere. Esplorate i bisogni e le motivazioni dei membri attuali e potenziali, per allineare le iniziative della comunità ai loro interessi e obiettivi.
    Infine, valutate che cosa i membri sono disposti a condividere nella comunità, perché questo determina il livello di collaborazione e di scambio di risorse. Affrontando questi aspetti potrete sviluppare una strategia più efficace per coinvolgere e sostenere la vostra comunità.
  reviewed: false
hr:
  title: Procjena zajednice
  description: Upoznajte svoju zajednicu.
  objective: |-
    - Kako definirate svoju zajednicu?
    - Koliko je velika i tko su njezini članovi?
    - Koje su njihove potrebe i motivacija?
    - Što su spremni dijeliti unutar zajednice?
    - Tko su mogući budući članovi?
  description_long: |-
    Razumijevanje dinamike vaše zajednice uključuje procjenu nekoliko ključnih aspekata. Najprije procijenite svrhu zajednice i njezinu veličinu kako biste odredili njezin doseg i mogući učinak. Zatim utvrdite tko su članovi kako biste razumjeli sastav zajednice. Ako želite rasti, razmislite o mogućim budućim članovima. Istražite potrebe i motivaciju sadašnjih i mogućih članova kako biste inicijative zajednice uskladili s njihovim interesima i ciljevima.
    Na kraju razmislite što su članovi spremni dijeliti unutar zajednice, jer o tome ovisi razina suradnje i razmjene resursa. Kad razjasnite ove elemente, možete razviti učinkovitiju strategiju za uključivanje i podršku svojoj zajednici.
  reviewed: false
bg:
  title: Оценка на общността
  description: Опознайте своята общност.
  objective: |-
    - Как определяте своята общност?
    - Колко голяма е тя и кои са членовете ѝ?
    - Какви са техните нужди и мотивация?
    - Какво са готови да споделят в рамките на общността?
    - Кои са възможните бъдещи членове?
  description_long: |-
    Разбирането на динамиката на вашата общност изисква оценка на няколко ключови аспекта. Първо оценете целта на общността и нейния размер, за да прецените обхвата и потенциалното ѝ въздействие. След това установете кои са членовете, за да разберете състава ѝ. Ако искате да се разраствате, помислете за бъдещи членове. Проучете нуждите и мотивацията на настоящите и бъдещите членове, за да съгласувате инициативите на общността с техните интереси и цели.
    Накрая помислете какво членовете са готови да споделят в рамките на общността, защото от това зависи нивото на сътрудничество и обмен на ресурси. Като изясните тези въпроси, ще можете да разработите по-ефективна стратегия за ангажиране и подкрепа на общността.
  reviewed: false
